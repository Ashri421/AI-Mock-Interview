<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="form-container">

    <h1>🔐 Admin Login</h1>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <br><br>

        <button class="btn" type="submit">
            Login
        </button>

    </form>

    {% if error %}
        <p style="color:red;">
            {{ error }}
        </p>
    {% endif %}

</div>

</body>
</html>
